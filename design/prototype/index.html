<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Docker folders — interactive prototype</title>

<!--
  Standalone, dependency-free reference prototype for the "Docker folders" design.
  Everything Docker-related is SIMULATED (timers + fake data). See ../DESIGN_SPEC.md.
  Rendering is a naive full re-render into #app on every state change; a real
  implementation should use the host UI's own rendering approach.
-->
<style>
:root {
  --bg: #101215; --surface: #16191D; --surface-folder: #191D22; --raised: #1F2328; --dialog: #1B1F24; --input: #121418; --well: #15181C;
  --border: #262B31; --border-strong: #2E333A; --border-pop: #343A42; --divider: #23272D; --divider-soft: #1F2328;
  --hover-row: #1C2026; --hover-ghost: #262B32; --hover-menu: #2A3038;
  --text: #E6E8EB; --text-2: #C9CED4; --text-muted: #9AA1AB; --text-dim: #8B929C; --text-faint: #7D8590; --text-disabled: #6F7782;
  --accent: #6EA8FE; --accent-hover: #8AB8FF; --on-accent: #0B1320; --accent-soft-bg: #1E3354; --accent-soft-fg: #CFE0FF; --chip-fg: #A9C9FF;
  --run: #3FB97A; --run-text: #8FDCB1; --stop-ring: #6B727C; --stop-seg: #3A4049; --stop-dot: #5C636D;
  --paused: #E0A43A; --paused-text: #F0C06A; --busy: #6EA8FE; --busy-text: #9CC2FF;
  --warn-bg: #3A2312; --warn-fg: #FFB27A; --warn-border: #66391A; --on-warn: #1D1006;
  --danger: #FF9B9B; --danger-border: #5A2A2A; --on-danger: #2A0A0A;
  --switch-on: #3D7BE0; --switch-off: #30353C; --switch-mixed: #4A5260; --knob: #F2F4F7;
  --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --r-control: 8px; --r-tile: 10px; --r-card: 12px; --r-dialog: 14px;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.4; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .4; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input::placeholder { color: var(--text-faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.pop { animation: pop .14s ease-out; }

.page { max-width: 1360px; margin: 0 auto; padding: 32px 24px 140px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
.head h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.summary { color: var(--text-muted); font-size: 13px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 12px; }
.input { height: 40px; padding: 0 12px; background: var(--input); border: 1px solid var(--border-strong); border-radius: var(--r-control); color: var(--text); font: inherit; }
.search .input { width: 260px; padding-left: 36px; background: #181B1F; }
.btn { height: 40px; padding: 0 14px; border-radius: var(--r-control); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.btn-ghost { background: transparent; border: 1px solid var(--border-strong); }
.btn-ghost:hover:not(:disabled) { background: var(--hover-ghost); }
.btn-primary { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 600; padding: 0 16px; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger-outline { background: transparent; border: 1px solid var(--danger-border); color: var(--danger); }
.icon-btn { width: 36px; height: 36px; border: 0; background: transparent; border-radius: var(--r-control); display: flex; align-items: center; justify-content: center; color: var(--text-muted); padding: 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.hscroll { overflow-x: auto; }
.table { min-width: 1100px; }
.g { display: grid; grid-template-columns: var(--cols); column-gap: 10px; align-items: center; padding: 0 12px; }
.thead { height: 40px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; }
.folder { border-bottom: 1px solid var(--divider); }
.frow { min-height: 64px; padding-top: 10px; padding-bottom: 10px; background: var(--surface-folder); }
.row:hover { background: var(--hover-row); }
.chev svg { transition: transform .15s; }
.chev[aria-expanded="true"] svg { transform: rotate(90deg); }
.fcell { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ficon { width: 40px; height: 40px; flex: none; padding: 0; border-radius: var(--r-tile); display: flex; align-items: center; justify-content: center; border: 1px solid transparent; }
.ficon:hover { box-shadow: 0 0 0 2px var(--accent); }
.fmeta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fname-btn { background: transparent; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 100%; align-self: flex-start; }
.fname-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.fname { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fsub { color: var(--text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcount { color: var(--text-muted); font-size: 12px; white-space: nowrap; flex: none; }
.strip { display: flex; flex-wrap: wrap; align-items: center; margin-left: -4px; }
.strip-btn { width: 38px; height: 38px; flex: none; padding: 0; border: 0; background: transparent; border-radius: var(--r-control); display: inline-flex; align-items: center; justify-content: center; }
.strip-btn:hover { background: var(--hover-ghost); }
.ctile { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 700; flex: none; }
.ctile .sdot { position: absolute; right: -4px; bottom: -4px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--surface-folder); }
.runcell { display: flex; flex-direction: column; gap: 6px; }
.segbar { display: flex; gap: 2px; width: 100px; height: 4px; }
.segbar span { flex: 1; border-radius: 2px; }
.num { font-family: var(--mono); font-size: 13px; color: var(--text-2); }
.port { font-family: var(--mono); font-size: 13px; color: var(--text-muted); }
.dash { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-border); font-size: 12px; font-weight: 500; white-space: nowrap; }
.muted { color: var(--text-dim); font-size: 13px; }
.crow { min-height: 52px; }
.tree { align-self: stretch; justify-self: center; width: 1px; background: var(--border-strong); }
.ccell { display: flex; align-items: center; gap: 12px; min-width: 0; padding-left: 8px; }
.order { width: 18px; flex: none; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
.cname { display: flex; flex-direction: column; min-width: 0; }
.cname b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cname small { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dot { display: block; flex: none; width: 10px; height: 10px; border-radius: 50%; }
.dot-running { background: var(--run); }
.dot-stopped { border: 2px solid var(--stop-ring); }
.dot-paused { border-radius: 0; border-left: 3px solid var(--paused); border-right: 3px solid var(--paused); }
.dot-busy { width: 12px; height: 12px; border: 2px solid var(--busy); border-right-color: transparent; animation: spin .8s linear infinite; }
.t-running { color: var(--run-text); } .t-stopped { color: var(--text-muted); } .t-paused { color: var(--paused-text); } .t-busy { color: var(--busy-text); }
.switch { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; padding: 6px 0; }
.track { position: relative; display: block; width: 34px; height: 20px; border-radius: 999px; background: var(--switch-off); flex: none; }
.track i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--knob); transition: left .15s; }
.switch[aria-pressed="true"] .track { background: var(--switch-on); } .switch[aria-pressed="true"] .track i { left: 16px; }
.switch[aria-pressed="mixed"] .track { background: var(--switch-mixed); } .switch[aria-pressed="mixed"] .track i { left: 9px; }
.switch small { font-size: 12px; color: var(--text-muted); }
.section-label { padding: 20px 12px 10px 74px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--divider); }
.loose { border-bottom: 1px solid var(--divider-soft); }
.empty { padding: 48px 24px; text-align: center; color: var(--text-muted); }
.tip { margin: 0; color: var(--text-dim); font-size: 12px; font-family: var(--mono); }

.scrim-btn { position: fixed; inset: 0; z-index: 40; background: transparent; border: 0; cursor: default; }
.menu { position: fixed; z-index: 50; width: 260px; max-height: 76vh; overflow-y: auto; background: var(--raised); border: 1px solid var(--border-pop); border-radius: var(--r-tile); box-shadow: var(--shadow-pop); padding: 6px; display: flex; flex-direction: column; }
.menu-head { padding: 8px 10px 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-sep { height: 1px; background: var(--border-strong); margin: 6px 4px; }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border: 0; background: transparent; border-radius: 6px; text-align: left; }
.mi:hover:not(:disabled) { background: var(--hover-menu); }
.mi .lbl { flex: 1; } .mi .hint { font-size: 12px; color: var(--text-dim); }

.overlay { position: fixed; inset: 0; z-index: 55; background: rgba(5, 6, 8, .66); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { position: relative; width: 100%; background: var(--dialog); color: var(--text); border: 1px solid var(--border-pop); border-radius: var(--r-dialog); box-shadow: 0 20px 48px rgba(0, 0, 0, .5); }
.confirm { max-width: 480px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.confirm h2 { margin: 0; font-size: 18px; font-weight: 600; }
.confirm p { margin: 0; color: #B4BAC2; text-wrap: pretty; }
.well { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; padding: 10px 12px; background: var(--well); border: 1px solid #2A2F36; border-radius: var(--r-tile); }
.well-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.editor { max-width: 1000px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden; }
.ed-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid #2A2F36; }
.ed-head h2 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; }
.ed-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
.ed-foot { display: flex; align-items: center; gap: 8px; padding: 14px 24px; border-top: 1px solid #2A2F36; flex-wrap: wrap; }
.preview { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid #2A2F36; border-radius: var(--r-tile); flex-wrap: wrap; }
.preview .eyebrow { font-size: 11px; width: 100%; }
.preview .ctile .sdot { border-color: var(--surface); }
.cols { display: flex; flex-wrap: wrap; gap: 28px; }
.col { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field-title { font-weight: 600; font-size: 13px; }
.field-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.small { font-size: 12px; color: var(--text-dim); }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--input); border: 1px solid #2A2F36; border-radius: var(--r-tile); }
.seg button { flex: 1; height: 36px; border: 0; border-radius: 7px; font-size: 13px; font-weight: 500; background: transparent; color: var(--text-muted); }
.seg button[aria-pressed="true"] { background: var(--hover-menu); color: var(--text); }
.pick { border-radius: var(--r-tile); background: var(--well); color: var(--text-2); border: 1px solid #2A2F36; padding: 0; }
.pick:hover { border-color: #5A6370; }
.pick[aria-pressed="true"] { background: var(--accent-soft-bg); color: var(--accent-soft-fg); border-color: var(--accent); }
.glyphs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.glyphs .pick { height: 48px; display: flex; align-items: center; justify-content: center; }
.webgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.webgrid .pick, .ctgrid .pick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; }
.ctgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.fname-cap { font-size: 11px; color: var(--text-dim); font-family: var(--mono); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check { display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 32px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; padding: 0; }
.swatch[aria-pressed="true"] { border: 2px solid var(--text) !important; box-shadow: inset 0 0 0 3px var(--dialog); }
.list { max-height: 228px; overflow-y: auto; border: 1px solid #2A2F36; border-radius: var(--r-tile); background: var(--well); padding: 4px; }
.list label { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 6px; cursor: pointer; }
.list label:hover { background: var(--hover-menu); }
.list .nm { flex: 1; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .tag { font-size: 11px; white-space: nowrap; color: var(--text-dim); }
.list .tag.move { color: var(--warn-fg); }
.olist { display: flex; flex-direction: column; gap: 4px; }
.orow { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px 0 10px; background: var(--well); border: 1px solid #2A2F36; border-radius: var(--r-control); }
.orow .n { width: 18px; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.orow .nm { flex: 1; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow .icon-btn { width: 32px; height: 32px; color: #B4BAC2; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft-bg); color: var(--chip-fg); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: transparent; border: 0; padding: 4px 0; text-align: left; width: 100%; font-size: 13px; }
.toggle-row[aria-pressed="true"] .track { background: var(--switch-on); } .toggle-row[aria-pressed="true"] .track i { left: 16px; }
.err { color: var(--danger); } .ok { color: var(--run-text); }

.jobs { position: fixed; right: 24px; bottom: 24px; z-index: 45; width: 340px; max-width: calc(100% - 32px); background: var(--raised); border: 1px solid var(--border-pop); border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.jobs-head { display: flex; align-items: center; gap: 10px; }
.jobs-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.jobs-title b { font-weight: 600; } .jobs-title small { font-size: 12px; color: var(--text-muted); }
.prog { height: 4px; background: var(--border-strong); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
.jrows { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
.jrow { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.jrow .nm { flex: 1; } .jrow .nt { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
.jdot { display: block; flex: none; width: 8px; height: 8px; margin: 1px; border-radius: 50%; border: 2px solid #4A515B; }
.jdot.done { border: 0; background: var(--run); }
.jdot.active { width: 10px; height: 10px; margin: 0; border: 2px solid var(--busy); border-right-color: transparent; animation: spin .8s linear infinite; }
.toasts { position: fixed; left: 24px; bottom: 24px; z-index: 46; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 48px); }
.toast { background: var(--text); color: var(--input); border-radius: var(--r-tile); padding: 10px 14px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 28px rgba(0, 0, 0, .45); max-width: 420px; }
</style>
</head>

/* ------------------------------------------------------------------ jobs (SIMULATED docker operations) */
function runOne(c, kind) { run({ id: null, name: c.name, members: [c.id], delay: 0, reverseStop: false }, kind); }
function run(f, kind) {
  if (busyNow()) { toast('Another job is still running'); return; }
  const cs = S.cs;
  const ids = f.members.filter(id => cs[id]);
  const rev = f.reverseStop ? ids.slice().reverse() : ids.slice();
  const steps = [];
  const St = (cid, busy, ms, then, note, doneNote, last) => steps.push({ cid, busy, ms, then, note, doneNote, last });
  const W = (cid, sec) => steps.push({ cid, busy: null, ms: 650, then: null, note: 'wait ' + sec + ' s', doneNote: null, last: false });
  let targets = [], title = '', done = '';
  if (kind === 'start') {
    targets = ids.filter(id => cs[id].status === 'stopped');
    targets.forEach((id, k) => { if (k > 0 && f.delay > 0) W(id, f.delay); St(id, 'Starting…', 900, { status: 'running' }, 'starting', 'started', true); });
    title = 'Starting ' + f.name; done = plural(targets.length, 'container') + ' started';
  } else if (kind === 'stop') {
    targets = rev.filter(id => cs[id].status === 'running' || cs[id].status === 'paused');
    targets.forEach(id => St(id, 'Stopping…', 800, { status: 'stopped' }, 'stopping', 'stopped', true));
    title = 'Stopping ' + f.name; done = plural(targets.length, 'container') + ' stopped' + (f.reverseStop && targets.length > 1 ? ', last-started first' : '');
  } else if (kind === 'restart') {
    const runIds = ids.filter(id => cs[id].status === 'running');
    rev.filter(id => runIds.includes(id)).forEach(id => St(id, 'Stopping…', 650, { status: 'stopped' }, 'stopping', null, false));
    targets = runIds;
    targets.forEach((id, k) => { if (k > 0 && f.delay > 0) W(id, f.delay); St(id, 'Starting…', 850, { status: 'running' }, 'starting', 'restarted', true); });
    title = 'Restarting ' + f.name; done = plural(targets.length, 'container') + ' restarted';
  } else if (kind === 'pause') {
    targets = ids.filter(id => cs[id].status === 'running');
    targets.forEach(id => St(id, 'Pausing…', 420, { status: 'paused' }, 'pausing', 'paused', true));
    title = 'Pausing ' + f.name; done = plural(targets.length, 'container') + ' paused';
  } else if (kind === 'resume') {
    targets = ids.filter(id => cs[id].status === 'paused');
    targets.forEach(id => St(id, 'Resuming…', 420, { status: 'running' }, 'resuming', 'running', true));
    title = 'Resuming ' + f.name; done = plural(targets.length, 'container') + ' resumed';
  } else if (kind === 'check') {
    targets = ids; let found = 0;
    targets.forEach(id => {
      const c = cs[id]; const u = !!(c.update || c.latent); if (u) found++;
      St(id, 'Checking…', 380, { status: c.status, update: u, latent: false }, 'checking', u ? 'update ready' : 'up to date', true);
    });
    title = 'Checking ' + f.name + ' for updates'; done = found ? plural(found, 'update') + ' ready' : 'Everything is up to date';
  } else if (kind === 'update' || kind === 'force') {
    targets = kind === 'update' ? ids.filter(id => cs[id].update) : ids;
    targets.forEach(id => {
      const back = cs[id].status === 'stopped' ? 'stopped' : 'running';
      St(id, 'Pulling image…', 950, null, 'pulling', null, false);
      St(id, 'Recreating…', 750, { status: back, update: false, latent: false }, 'recreating', back === 'stopped' ? 'updated, left stopped' : 'updated', true);
    });
    title = (kind === 'force' ? 'Force updating ' : 'Updating ') + f.name; done = plural(targets.length, 'container') + ' updated';
  }
  if (!targets.length) { toast('Nothing to do in “' + f.name + '”'); return; }
  const rows = targets.map(id => ({ cid: id, name: cs[id].name, state: 'queued', note: 'queued' }));
  const job = { id: seq++, title, steps, rows, i: 0, done: false, doneText: done };
  set({ job });
  setTimeout(() => step(job.id, 0), 250);
}
function step(jobId, i) {
  const job = S.job;
  if (!job || job.id !== jobId) return;
  if (i >= job.steps.length) {
    set({ job: Object.assign({}, job, { done: true, i }) });
    setTimeout(() => { if (S.job && S.job.id === jobId) set({ job: null }); }, 6500);
    return;
  }
  const st = job.steps[i];
  const cs = Object.assign({}, S.cs);
  if (st.busy) cs[st.cid] = Object.assign({}, cs[st.cid], { status: 'busy', busy: st.busy });
  set({ cs, job: Object.assign({}, job, { i, rows: job.rows.map(r => r.cid === st.cid ? Object.assign({}, r, { state: 'active', note: st.note }) : r) }) });
  setTimeout(() => {
    const j2 = S.job; if (!j2 || j2.id !== jobId) return;
    const cs2 = Object.assign({}, S.cs);
    if (st.then) cs2[st.cid] = Object.assign({}, cs2[st.cid], st.then, { busy: null });
    // last step for a container -> done; an intermediate step that changed status (e.g. the stop half of a restart) -> back to queued with that status
    const rows = j2.rows.map(r => {
      if (r.cid !== st.cid) return r;
      if (st.last) return Object.assign({}, r, { state: 'done', note: st.doneNote });
      if (st.then && st.then.status) return Object.assign({}, r, { state: 'queued', note: st.then.status });
      return r;
    });
    set({ cs: cs2, job: Object.assign({}, j2, { i: i + 1, rows }) });
    setTimeout(() => step(jobId, i + 1), 70);
  }, st.ms);
}

  if (!/^https?:\/\/[^\s/]+\/\S+\.(png|svg|jpe?g|webp|ico)(\?\S*)?$/i.test(u)) { patchEd({ webMsg: 'Paste a direct link to a .png, .svg, .jpg or .webp image', webMsgOk: false }); return; }
  const file = u.split('?')[0].split('/').pop(); const host = u.replace(/^https?:\/\//i, '').split('/')[0];
  patchEd({ icon: { type: 'web', src: 3, letter: firstLetter(file), query: file }, iconAuto: false, webMsg: 'Downloaded ' + file + ' from ' + host + ' · stored locally so it shows offline', webMsgOk: true });
}
function saveEd() {
  const ed = S.ed; const name = ed.name.trim();
  if (!name) { patchEd({ error: 'Give the folder a name' }); return; }
  if (S.folders.some(f => f.id !== ed.id && f.name.toLowerCase() === name.toLowerCase())) { patchEd({ error: 'Another folder already uses this name' }); return; }
  const members = ed.members.concat(ruleMatches(ed).ids);
  const id = ed.id || ('f-' + seq++);
  const rec = { id, name, color: ed.color, icon: edIcon(ed), members, delay: Math.max(0, Math.min(300, parseInt(ed.delay, 10) || 0)), reverseStop: ed.reverseStop, preview: ed.preview, rule: (ed.rule || '').trim(), dashboard: ed.dashboard, expanded: true };
  let folders = S.folders.map(f => f.id === id ? Object.assign({}, f, rec, { expanded: f.expanded }) : Object.assign({}, f, { members: f.members.filter(m => !members.includes(m)) }));
  if (!ed.id) folders = folders.concat([rec]);
  set({ folders, ed: null });
  toast((ed.id ? 'Saved “' : 'Created “') + name + '” · ' + plural(members.length, 'container'));
}

      <div class="tools">
        <label class="search"><span class="sr">Filter containers</span>${svg(P.search, 16, 2, 'style="color:var(--text-dim)"')}
          <input id="q" type="search" class="input" data-input="query" value="${esc(S.query)}" placeholder="Filter containers or folders"></label>
        <button class="btn btn-ghost" id="toggle-all" data-act="toggle-all">${anyCollapsed ? 'Unfold all' : 'Fold all'}</button>
        <button class="btn btn-primary" id="new-folder" data-act="new-folder">${svg(P.plus, 16, 2.2)}<span>New folder</span></button>
      </div>
    </header>
    <section class="card"><div class="hscroll"><div class="table">
      <div class="g thead"><span></span><span>Container</span><span>Status</span><span>Version</span><span>Port</span><span>CPU</span><span>Memory</span><span>Autostart</span><span></span></div>
      ${folders.join('')}
      ${loose.length ? `<div class="section-label">Not in a folder · ${loose.length}</div>${loose.map(id => containerRow(S.cs[id], 0, false)).join('')}` : ''}
      ${searching && !folders.length && !loose.length ? `<div class="empty">Nothing matches “${esc(S.query.trim())}”</div>` : ''}
    </div></div></section>
    <p class="tip">Tip: a folder's icon opens its commands · each container icon opens that container's menu · the folder name unfolds it</p>
  </div>
  ${menuView()}${confirmView()}${editorView()}${jobView()}`;
}

/* ------------------------------------------------------------------ render (keeps focus, caret and scroll across re-renders) */
function render() {
  const a = document.activeElement;
  const focusId = a && a.id ? a.id : null;
  let s0 = null, s1 = null;
  try { if (a && typeof a.selectionStart === 'number') { s0 = a.selectionStart; s1 = a.selectionEnd; } } catch (e) {}
  const scrolls = {};
  document.querySelectorAll('[data-keep-scroll]').forEach(el => { scrolls[el.dataset.keepScroll] = el.scrollTop; });
  app.innerHTML = appView();
  document.querySelectorAll('[data-keep-scroll]').forEach(el => { if (scrolls[el.dataset.keepScroll] != null) el.scrollTop = scrolls[el.dataset.keepScroll]; });
  if (focusId) {
    const n = document.getElementById(focusId);
    if (n) { n.focus({ preventScroll: true }); try { if (s0 != null) n.setSelectionRange(s0, s1); } catch (e) {} }
  }
}
function renderToasts() {
  document.getElementById('toasts').innerHTML = S.toasts.map(t => `<div class="toast pop">${esc(t.msg)}</div>`).join('');
}

/* ------------------------------------------------------------------ events */
const ACT = {
  'toggle-folder': fid => { const f = S.folders.find(x => x.id === fid); if (f) patchFolder(fid, { expanded: !f.expanded }); },
  'folder-menu': (fid, el) => openMenu(el, 'folder', fid, 'right'),
  'folder-icon-menu': (fid, el) => openMenu(el, 'folder', fid, 'left'),
  'container-menu': (cid, el) => openMenu(el, 'container', cid, 'right'),
  'strip-menu': (cid, el) => openMenu(el, 'container', cid, 'left'),
  'close-menu': () => closeMenu(),
  'menu': i => { const fn = menuRuns[Number(i)]; closeMenu(false); if (fn) fn(); },
  'auto-container': cid => setC(cid, { autostart: !S.cs[cid].autostart }),
  'auto-folder': fid => {
    const f = S.folders.find(x => x.id === fid); const all = f.members.filter(id => S.cs[id]);
    const target = !(all.length > 0 && all.every(id => S.cs[id].autostart));
    const cs = Object.assign({}, S.cs); all.forEach(id => { cs[id] = Object.assign({}, cs[id], { autostart: target }); }); set({ cs });
  },
  'toggle-all': () => { const open = S.folders.some(f => !f.expanded); set({ folders: S.folders.map(f => Object.assign({}, f, { expanded: open })) }); },
  'new-folder': () => openEditor(null),
  'confirm-cancel': () => set({ confirm: null }),
  'confirm-ok': () => doConfirm(),
  'job-dismiss': () => set({ job: null }),
  'ed-cancel': () => set({ ed: null }),
  'ed-save': () => saveEd(),
  'ed-delete': () => set({ ed: null, confirm: { kind: 'delete', fid: S.ed.id } }),
  'ed-tab': k => patchEd({ tab: k }),
  'ed-glyph': k => patchEd({ icon: { type: 'glyph', key: k }, iconAuto: false }),
  'ed-web': k => { const q = (S.ed.webQuery === null ? S.ed.name : S.ed.webQuery).trim(); patchEd({ icon: { type: 'web', src: Number(k), letter: firstLetter(q), query: q }, iconAuto: false }); },
  'ed-cicon': cid => patchEd({ icon: { type: 'container', cid }, iconAuto: false }),
  'ed-color': k => patchEd({ color: k }),
  'ed-up': k => moveMember(Number(k), -1),
  'ed-down': k => moveMember(Number(k), 1),
  'ed-download': () => downloadUrl(),
  'ed-rev': () => patchEd({ reverseStop: !S.ed.reverseStop }),
  'ed-dash': () => patchEd({ dashboard: !S.ed.dashboard }),
  'ed-preview': k => patchEd({ preview: k })
};
const INPUT = {
  'query': v => set({ query: v }),
  'ed-name': v => patchEd({ name: v, error: '' }),
  'ed-webq': v => patchEd({ webQuery: v }),
  'ed-weburl': v => patchEd({ webUrl: v, webMsg: '' }),
  'ed-search': v => patchEd({ search: v }),
  'ed-rule': v => patchEd({ rule: v }),
  'ed-delay': v => patchEd({ delay: v })
};
const CHANGE = {
  'ed-member': cid => { const m = S.ed.members.includes(cid) ? S.ed.members.filter(x => x !== cid) : S.ed.members.concat([cid]); patchEd({ members: m }); },
  'ed-auto': () => patchEd({ iconAuto: !S.ed.iconAuto, webQuery: null })
};
function moveMember(k, dir) {
  const m = S.ed.members.slice(); const j = k + dir; if (j < 0 || j >= m.length) return;
  [m[k], m[j]] = [m[j], m[k]]; patchEd({ members: m });
}
function closeMenu(restoreFocus = true) {
  const back = S.menu && S.menu.returnFocus;
  set({ menu: null });
  if (restoreFocus && back) { const n = document.getElementById(back); if (n) n.focus(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset.arg, el);
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.input; if (k && INPUT[k]) INPUT[k](e.target.value); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.change; if (k && CHANGE[k]) CHANGE[k](e.target.dataset.arg); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.menu) closeMenu(); else if (S.confirm) set({ confirm: null }); else if (S.ed) set({ ed: null });
});

render();
</script>
</body>
</html>
