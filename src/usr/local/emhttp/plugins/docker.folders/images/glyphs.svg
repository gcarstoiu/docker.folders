<?xml version="1.0" encoding="UTF-8"?>
<!--
  docker.folders - built-in folder glyphs.
  Copyright (C) 2026  gcarstoiu
  Licensed under the GNU General Public License version 2.

  The 14 glyphs DESIGN_SPEC.md 9 asks for, as one sprite: a single request,
  and the stroke inherits currentColor so one sprite serves every folder
  colour and both themes.

  All paths are drawn on a 24-unit grid with a 1.75 stroke, round caps and
  joins, and no fills - matching the design's icon style. These are original
  geometric marks, not third-party app logos (the spec is explicit that each
  container's own icon comes from Unraid instead).
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.75;
               stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <symbol id="df-g-folder" viewBox="0 0 24 24">
    <path d="M3 7.5a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.5.7l1 1.1h9a2 2 0 0 1 2 2v7.2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  </symbol>

  <symbol id="df-g-media" viewBox="0 0 24 24">
    <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
    <path d="M10 9.2l5 2.8-5 2.8z"/>
  </symbol>

  <symbol id="df-g-downloads" viewBox="0 0 24 24">
    <path d="M12 3.5v10.5"/>
    <path d="M7.5 10L12 14.5 16.5 10"/>
    <path d="M4 17v1.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V17"/>
  </symbol>

  <symbol id="df-g-home" viewBox="0 0 24 24">
    <path d="M3.5 10.5L12 3.5l8.5 7"/>
    <path d="M5.5 9.8v9.2a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V9.8"/>
    <path d="M9.8 20.5v-5.2h4.4v5.2"/>
  </symbol>

  <symbol id="df-g-ai" viewBox="0 0 24 24">
    <rect x="7" y="7" width="10" height="10" rx="2.5"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/>
  </symbol>

  <symbol id="df-g-databases" viewBox="0 0 24 24">
    <ellipse cx="12" cy="6" rx="7" ry="2.8"/>
    <path d="M5 6v12c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8V6"/>
    <path d="M5 12c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8"/>
  </symbol>

  <symbol id="df-g-cloud" viewBox="0 0 24 24">
    <path d="M7 18.5a4 4 0 0 1-.4-7.98 5.2 5.2 0 0 1 10.03-1.4A3.8 3.8 0 0 1 17.4 18.5z"/>
  </symbol>

  <symbol id="df-g-security" viewBox="0 0 24 24">
    <path d="M12 3.2l7 2.6v5.9c0 4.2-2.9 7.6-7 9.1-4.1-1.5-7-4.9-7-9.1V5.8z"/>
    <path d="M9.2 12.1l2 2 3.6-3.8"/>
  </symbol>

  <symbol id="df-g-network" viewBox="0 0 24 24">
    <rect x="9.2" y="2.8" width="5.6" height="5" rx="1.4"/>
    <rect x="2.6" y="16.2" width="5.6" height="5" rx="1.4"/>
    <rect x="15.8" y="16.2" width="5.6" height="5" rx="1.4"/>
    <path d="M12 7.8v4.4M5.4 16.2v-2.2h13.2v2.2M12 12.2v1.8"/>
  </symbol>

  <symbol id="df-g-photos" viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <circle cx="8.3" cy="10.2" r="1.7"/>
    <path d="M3.2 17.2l4.9-4.3a1.8 1.8 0 0 1 2.4 0l3.4 3 2.3-2a1.8 1.8 0 0 1 2.4 0l2.2 2"/>
  </symbol>

  <symbol id="df-g-music" viewBox="0 0 24 24">
    <path d="M9.2 18V5.6l9.3-2v11.6"/>
    <circle cx="6.6" cy="18" r="2.6"/>
    <circle cx="15.9" cy="15.2" r="2.6"/>
  </symbol>

  <symbol id="df-g-monitoring" viewBox="0 0 24 24">
    <rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/>
    <path d="M6 12.5l2.8-3.4 2.4 2.8 2.3-4.2L16 12.5h2"/>
    <path d="M9 20.5h6"/>
  </symbol>

  <symbol id="df-g-passwords" viewBox="0 0 24 24">
    <rect x="4.2" y="10.3" width="15.6" height="10.2" rx="2.3"/>
    <path d="M7.8 10.3V7.4a4.2 4.2 0 0 1 8.4 0v2.9"/>
    <circle cx="12" cy="15.4" r="1.5"/>
  </symbol>

  <symbol id="df-g-games" viewBox="0 0 24 24">
    <path d="M7.4 7.5h9.2a4.6 4.6 0 0 1 4.5 3.7l.7 4.1a2.6 2.6 0 0 1-4.7 1.9l-1.3-1.9H8.2l-1.3 1.9a2.6 2.6 0 0 1-4.7-1.9l.7-4.1a4.6 4.6 0 0 1 4.5-3.7z"/>
    <path d="M7.6 11v2.6M6.3 12.3h2.6"/>
    <circle cx="16.1" cy="11.6" r=".9"/>
    <circle cx="18" cy="13.6" r=".9"/>
  </symbol>

  <!-- Not a folder icon: used by the filter box and the editor's searches. -->
  <symbol id="df-g-search" viewBox="0 0 24 24">
    <circle cx="10.6" cy="10.6" r="6.6"/>
    <path d="M15.4 15.4l4.8 4.8"/>
  </symbol>
</svg>
